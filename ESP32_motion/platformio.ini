; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32_wroom]
board = esp32dev
platform = espressif32@6.13.0  ; Arduino-ESP32 core 2.0.17（PS3 手柄库要求 2.0.17~3.3.6）
framework = arduino
extra_scripts = pre:scripts/gen_defaults.py  ; 由 config/default_motion.json 生成默认参数
lib_deps =
    ; 官方指定库（jvpernis/esp32-ps3 的兼容性 fork），勿同时安装老的 PS3 Controller Host
    https://github.com/emakefun-arduino-library/emakefun_esp32_ps3.git#v2.0.1
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; upload_speed = 115200  ; CP2102N 在 460800 下易掉流("Serial data stream stopped")
board_microros_transport = wifi
board_microros_distro = humble  ; 明确指定ROS 2版本
board_build.partitions = huge_app.csv
board_build.ignore_board_partitions = yes
; board_upload.flash_size = 4MB
; board_upload.compress = true
; board_build.flash_size = 4MB

build_flags =
    -DBOARD_HAS_PSRAM=1
    -DCONFIG_SPIRAM_USE=1
    -DCONFIG_SPIRAM_TYPE_OCTAL=1  ; 强调八进制PSRAM类型
    -DCONFIG_SPIRAM_MODE_OCT=1
    -mfix-esp32-psram-cache-issue  ; 解决PSRAM缓存冲突问题

    -Llib/motion_status_msgs/lib
    -lmotion_status_msgs__rosidl_generator_c
    -lmotion_status_msgs__rosidl_typesupport_c
    -lmotion_status_msgs__rosidl_typesupport_introspection_c
    -lmotion_status_msgs__rosidl_typesupport_microxrcedds_c

    -Llib/motion_settings_service/lib
    -lmotion_settings_service__rosidl_generator_c
    -lmotion_settings_service__rosidl_typesupport_c
    -lmotion_settings_service__rosidl_typesupport_introspection_c
    -lmotion_settings_service__rosidl_typesupport_microxrcedds_c